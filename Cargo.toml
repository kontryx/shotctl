[package]
name = "shotctl"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-driven photo import and archive manager"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kontryx/shotctl"
authors = ["kontryx <konbog@protonmail.com>"]
keywords = ["photos", "import", "tui", "camera", "archive"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = "0.4"
crossterm = "0.29"
dirs = "6"
filetime = "0.2"
kamadak-exif = "0.6"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
walkdir = "2"
